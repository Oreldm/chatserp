<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#0d1117"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="80" y="150" font-size="92" font-weight="700" fill="#f0f6fc">Chat<tspan fill="#3fb950">SEO</tspan></text>
    <text x="84" y="205" font-size="30" fill="#8b949e">SEO was Google. The next search box is a chat.</text>
